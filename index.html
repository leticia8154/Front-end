<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta charset="utf-8" />
    <title>Login - estacIA</title>
    <style>
      /* --- RESET E ESTILOS GLOBAIS --- */
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      }

      body {
        background-color: #1b59f8; /* Fundo Azul */
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        padding: 16px;
      }

      /* CONTAINER BASE COM TAMANHO FIXO E PADRONIZADO (IGUAL NO CADASTRO E LOGIN) */
      .card-container {
        width: 100%;
        max-width: 380px;
        height: 640px; /* Altura fixa idêntica para eliminar qualquer diferença de tamanho */
        background-color: #ffffff;
        border-radius: 28px;
        overflow: hidden;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.25);
        display: flex;
        flex-direction: column;
        position: relative;
      }

      /* SEÇÃO SUPERIOR CREME/HERO IDÊNTICA */
      .hero-section {
        background-color: #f6f3eb;
        padding: 24px 20px 16px 20px;
        text-align: center;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        height: 220px; /* Mesma altura de topo em ambas as telas */
      }

      .hero-logo {
        max-height: 60px;
        width: auto;
        object-fit: contain;
        background-color: transparent;
        margin-bottom: 12px;
      }

      .hero-title {
        font-size: 1.35rem;
        font-weight: 700;
        color: #1c1c1e;
        margin-bottom: 4px;
      }

      .hero-subtitle {
        font-size: 0.8rem;
        color: #6e6e73;
        line-height: 1.2;
      }

      /* TABS (ENTRAR / CADASTRAR) */
      .nav-tabs {
        display: flex;
        width: 100%;
        background-color: #f6f3eb;
        border-bottom: 1px solid #e5e5ea;
      }

      .nav-tab {
        flex: 1;
        padding: 12px 0;
        text-align: center;
        text-decoration: none;
        font-weight: 600;
        font-size: 0.85rem;
        color: #6e6e73;
        background-color: #f6f3eb;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 6px;
        transition: all 0.2s ease;
      }

      .nav-tab.active {
        background-color: #ffffff;
        color: #1b59f8;
        border-bottom: 2px solid #1b59f8;
      }

      /* FORMULÁRIO COM PREENCHIMENTO AJUSTADO E COMPACTO */
      .form-section {
        padding: 20px 24px;
        display: flex;
        flex-direction: column;
        gap: 12px;
        flex: 1;
        justify-content: center;
      }

      .input-group {
        display: flex;
        flex-direction: column;
        gap: 5px;
      }

      .input-group label {
        font-size: 0.8rem;
        font-weight: 600;
        color: #1c1c1e;
        display: flex;
        align-items: center;
        gap: 6px;
      }

      .input-field {
        width: 100%;
        padding: 11px 14px;
        border: 1px solid #e5e5ea;
        border-radius: 12px;
        font-size: 0.88rem;
        outline: none;
        transition: border-color 0.2s ease;
      }

      .input-field:focus {
        border-color: #1b59f8;
      }

      .forgot-password {
        align-self: flex-end;
        font-size: 0.75rem;
        color: #1b59f8;
        text-decoration: none;
        font-weight: 600;
        margin-top: -4px;
      }

      .btn-primary {
        width: 100%;
        background-color: #1b59f8;
        color: #ffffff;
        border: none;
        border-radius: 12px;
        padding: 13px;
        font-weight: 700;
        font-size: 0.95rem;
        cursor: pointer;
        text-align: center;
        text-decoration: none;
        box-shadow: 0 4px 12px rgba(27, 89, 248, 0.3);
        margin-top: 4px;
        transition: transform 0.1s ease, background-color 0.2s ease;
      }

      .btn-primary:active {
        transform: scale(0.98);
      }

      .footer-text {
        text-align: center;
        font-size: 0.78rem;
        color: #6e6e73;
        margin-top: 6px;
      }

      .footer-text a {
        color: #1b59f8;
        font-weight: 700;
        text-decoration: none;
      }

      /* MEDIA QUERIES PARA ADAPTAÇÃO EM LANDSCAPE OU TELAS CURTAS */
      @media (max-height: 680px) or (orientation: landscape) {
        body {
          height: auto;
          min-height: 100vh;
          padding: 16px;
        }

        .card-container {
          margin: auto;
        }
      }
    </style>
  </head>
  <body>
    <main class="card-container">
      
      <!-- Topo Creme (Hero Section) -->
      <section class="hero-section">
        <img class="hero-logo" src="https://c.animaapp.com/YpraINo5/img/frame-2085660897.svg" alt="estacIA Logo" />
        <h1 class="hero-title">Bem-vindo!</h1>
        <p class="hero-subtitle">Estacionamento inteligente ao<br />seu alcance</p>
      </section>

      <!-- Navegação por Abas -->
      <nav class="nav-tabs">
        <a href="index.html" class="nav-tab active">
          <span>➔]</span> Entrar
        </a>
        <a href="cadastro.html" class="nav-tab">
          <span>👤+</span> Cadastrar
        </a>
      </nav>

      <!-- Form de Login -->
      <form class="form-section" action="principal.html" method="GET">
        <div class="input-group">
          <label for="email">✉ E-mail</label>
          <input type="email" id="email" class="input-field" placeholder="seu@email.com" required />
        </div>

        <div class="input-group">
          <label for="senha">🔒 Senha</label>
          <input type="password" id="senha" class="input-field" placeholder="••••••••" required />
        </div>

        <a href="#" class="forgot-password">Esqueceu a senha?</a>

        <button type="submit" class="btn-primary">Entrar</button>

        <p class="footer-text">
          Não tem uma conta? <a href="cadastro.html">Cadastre-se</a>
        </p>
      </form>

    </main>
  </body>
</html>
