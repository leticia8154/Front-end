<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>EstaciA - Painel Principal</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Inter', sans-serif;
    }

    body {
      background-color: #1b59f8;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    /* Container do Card Principal */
    .card-container {
      background-color: #f6f3eb; /* Fundo Creme da tela principal */
      width: 100%;
      max-width: 380px;
      min-height: 640px;
      border-radius: 28px;
      padding: 24px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.25);
      display: flex;
      flex-direction: column;
      position: relative;
    }

    /* Topo com Ícone de Sair */
    .header-top {
      display: flex;
      justify-content: flex-end;
      margin-bottom: 8px;
    }

    .logout-btn {
      color: #1b59f8;
      text-decoration: none;
      display: flex;
      align-items: center;
      gap: 4px;
      font-size: 0.85rem;
      font-weight: 600;
    }

    /* Saudação */
    .user-greeting {
      font-size: 1.5rem;
      font-weight: 700;
      color: #1c1c1e;
      display: flex;
      align-items: center;
      gap: 6px;
      margin-bottom: 2px;
    }

    .user-email {
      font-size: 0.8rem;
      color: #6e6e73;
      margin-bottom: 20px;
    }

    .section-label {
      font-size: 0.72rem;
      font-weight: 700;
      color: #8e8e93;
      letter-spacing: 0.5px;
      margin-bottom: 8px;
      text-transform: uppercase;
    }

    /* SELECT / DROPDOWN DO SHOPPING */
    .select-container {
      position: relative;
      width: 100%;
      margin-bottom: 16px;
    }

    .select-btn {
      width: 100%;
      background-color: #ffffff;
      border: 2px solid #1c1c1e;
      border-radius: 18px;
      padding: 12px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      cursor: pointer;
      font-weight: 700;
      font-size: 0.9rem;
      color: #1c1c1e;
      transition: all 0.2s ease;
    }

    .select-btn-content {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .chevron-icon {
      transition: transform 0.2s ease;
    }

    .chevron-icon.rotate {
      transform: rotate(180deg);
    }

    /* MENU DE OPÇÕES */
    .dropdown-menu {
      display: none;
      position: absolute;
      top: calc(100% + 6px);
      left: 0;
      width: 100%;
      background-color: #ffffff;
      border-radius: 18px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.15);
      overflow: hidden;
      z-index: 100;
    }

    .dropdown-menu.active {
      display: block;
    }

    .dropdown-item {
      padding: 14px 18px;
      font-size: 0.88rem;
      color: #1c1c1e;
      cursor: pointer;
      transition: background-color 0.2s ease;
      font-weight: 500;
    }

    .dropdown-item:hover {
      background-color: #f0f5ff;
    }

    .dropdown-item.selected {
      background-color: #ecf2fe;
      color: #1b59f8;
      font-weight: 700;
    }

    /* CARDS DE VAGAS / HISTÓRICO */
    .vagas-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-top: auto;
    }

    .vaga-card {
      background-color: #ffffff;
      border-radius: 16px;
      padding: 14px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.04);
    }

    .vaga-info {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .vaga-icon {
      width: 36px;
      height: 36px;
      background-color: #eaf2ff;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #1b59f8;
    }

    .vaga-detalhes h4 {
      font-size: 0.88rem;
      font-weight: 700;
      color: #1c1c1e;
    }

    .vaga-detalhes p {
      font-size: 0.75rem;
      color: #8e8e93;
      margin-top: 2px;
    }

    .vaga-preco {
      font-size: 0.9rem;
      font-weight: 700;
      color: #1b59f8;
    }
  </style>
</head>
<body>

  <main class="card-container">
    
    <!-- Botão de Sair -->
    <div class="header-top">
      <a href="index.html" class="logout-btn" title="Sair">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
          <polyline points="16 17 21 12 16 7"></polyline>
          <line x1="21" y1="12" x2="9" y2="12"></line>
        </svg>
      </a>
    </div>

    <!-- Saudação do Usuário -->
    <h1 class="user-greeting">Olá, Letícia! 👋</h1>
    <p class="user-email">silvaleticia0008@gmail.com</p>

    <!-- Rótulo do Dropdown -->
    <p class="section-label">Shopping Atual</p>

    <!-- SELECT / DROPDOWN -->
    <div class="select-container">
      <button type="button" class="select-btn" id="selectBtn" onclick="toggleDropdown()">
        <div class="select-btn-content">
          <!-- Ícone do Prédio -->
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#1b59f8" stroke-width="2">
            <path d="M6 22V4a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v18Z"/>
            <path d="M6 12h12"/>
            <path d="M6 7h12"/>
            <path d="M6 17h12"/>
          </svg>
          <!-- Nome do Shopping Selecionado -->
          <span id="selectedShoppingName">Brasilia Shopping</span>
        </div>
        
        <!-- Ícone da Seta -->
        <svg class="chevron-icon" id="chevronIcon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#1c1c1e" stroke-width="2">
          <polyline points="6 9 12 15 18 9"/>
        </svg>
      </button>

      <!-- Lista de Opções -->
      <div class="dropdown-menu" id="dropdownMenu">
        <div class="dropdown-item" onclick="selectShopping('Shopping Center - Bloco A')">Shopping Center - Bloco A</div>
        <div class="dropdown-item" onclick="selectShopping('Shopping Center - Bloco B')">Shopping Center - Bloco B</div>
        <div class="dropdown-item" onclick="selectShopping('Shopping Norte')">Shopping Norte</div>
        <div class="dropdown-item" onclick="selectShopping('Shopping Sul')">Shopping Sul</div>
        <div class="dropdown-item" onclick="selectShopping('Mega Center')">Mega Center</div>
      </div>
    </div>

    <!-- Lista de Vagas/Reservas Recentes -->
    <div class="vagas-list">
      
      <div class="vaga-card">
        <div class="vaga-info">
          <div class="vaga-icon">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M12 2a8 8 0 0 0-8 8c0 5.25 8 12 8 12s8-6.75 8-12a8 8 0 0 0-8-8z"/>
              <circle cx="12" cy="10" r="3"/>
            </svg>
          </div>
          <div class="vaga-detalhes">
            <h4>Setor A2 - Vaga 145</h4>
            <p>05/04/2026 • 3h 20min</p>
          </div>
        </div>
        <div class="vaga-preco">R$ 18,00</div>
      </div>

      <div class="vaga-card">
        <div class="vaga-info">
          <div class="vaga-icon">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M12 2a8 8 0 0 0-8 8c0 5.25 8 12 8 12s8-6.75 8-12a8 8 0 0 0-8-8z"/>
              <circle cx="12" cy="10" r="3"/>
            </svg>
          </div>
          <div class="vaga-detalhes">
            <h4>Setor B1 - Vaga 089</h4>
            <p>02/04/2026 • 1h 45min</p>
          </div>
        </div>
        <div class="vaga-preco">R$ 12,00</div>
      </div>

    </div>

  </main>

  <!-- LÓGICA DE INTERAÇÃO (JAVASCRIPT) -->
  <script>
    // Função para abrir/fechar o menu ao clicar no botão
    function toggleDropdown() {
      const menu = document.getElementById('dropdownMenu');
      const chevron = document.getElementById('chevronIcon');
      
      menu.classList.toggle('active');
      chevron.classList.toggle('rotate');
    }

    // Função executada ao clicar em uma das opções
    function selectShopping(nomeShopping) {
      // 1. Atualiza o texto do botão com o nome do shopping clicado
      document.getElementById('selectedShoppingName').innerText = nomeShopping;

      // 2. Oculta o menu e reseta a rotação da seta
      const menu = document.getElementById('dropdownMenu');
      const chevron = document.getElementById('chevronIcon');
      
      menu.classList.remove('active');
      chevron.classList.remove('rotate');

      // 3. Atualiza o destaque visual da lista
      const items = document.querySelectorAll('.dropdown-item');
      items.forEach(item => {
        if (item.innerText === nomeShopping) {
          item.classList.add('selected');
        } else {
          item.classList.remove('selected');
        }
      });
    }

    // Fecha o menu caso o usuário clique fora da caixa do select
    document.addEventListener('click', function(event) {
      const container = document.querySelector('.select-container');
      const menu = document.getElementById('dropdownMenu');
      const chevron = document.getElementById('chevronIcon');

      if (container && !container.contains(event.target)) {
        menu.classList.remove('active');
        chevron.classList.remove('rotate');
      }
    });
  </script>

</body>
</html>
