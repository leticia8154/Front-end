<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>EstaciA - Recuperar Senha</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Inter', sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background: linear-gradient(180deg, #0d47a1 0%, #1565c0 50%, #0a2540 100%);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 16px;
    }

    .card-container {
      background-color: #f7f4ee;
      width: 100%;
      max-width: 420px;
      border-radius: 28px;
      overflow: hidden;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
      padding: 32px 24px;
      display: flex;
      flex-direction: column;
      gap: 20px;
      transition: max-width 0.3s ease;
    }

    /* ADAPTAÇÃO PARA TABLETS E CENTRAIS VEICULARES */
    @media (min-width: 768px) {
      .card-container {
        max-width: 680px;
        padding: 40px 36px;
        gap: 24px;
      }

      .header-title h2 {
        font-size: 24px !important;
      }

      .input-field {
        font-size: 16px !important;
        padding: 16px 14px !important;
      }

      .btn-primary {
        padding: 18px !important;
        font-size: 17px !important;
      }
    }

    .header-bar {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .back-btn {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background-color: #ffffff;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #1565c0;
      text-decoration: none;
      box-shadow: 0 2px 5px rgba(0,0,0,0.05);
      flex-shrink: 0;
    }

    .header-title h2 {
      font-size: 20px;
      font-weight: 700;
      color: #1a1a1a;
    }

    .header-title p {
      font-size: 12px;
      color: #666666;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .input-wrapper {
      position: relative;
      background-color: #ffffff;
      border: 1px solid #e2e8f0;
      border-radius: 14px;
      display: flex;
      align-items: center;
      padding: 0 14px;
      transition: all 0.2s ease;
    }

    .input-wrapper:focus-within {
      border-color: #1565c0;
      box-shadow: 0 0 0 3px rgba(21, 101, 192, 0.12);
    }

    .input-icon {
      color: #1565c0;
      display: flex;
      align-items: center;
      margin-right: 10px;
      flex-shrink: 0;
    }

    .input-field {
      width: 100%;
      border: none;
      background: transparent;
      padding: 14px 0;
      font-size: 14px;
      font-weight: 500;
      color: #2d3748;
      outline: none;
    }

    .btn-primary {
      width: 100%;
      background-color: #1565c0;
      color: #ffffff;
      border: none;
      padding: 16px;
      border-radius: 14px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      box-shadow: 0 4px 12px rgba(21, 101, 192, 0.3);
      text-decoration: none;
      margin-top: 6px;
    }

    .footer-text {
      text-align: center;
      font-size: 13px;
      color: #666666;
    }

    .footer-text a {
      color: #1565c0;
      font-weight: 700;
      text-decoration: none;
    }
  </style>
</head>
<body>

  <div class="card-container">
    
    <!-- CABEÇALHO -->
    <div class="header-bar">
      <a href="index.html" class="back-btn" title="Voltar">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>
      </a>
      <div class="header-title">
        <h2>Recuperar Senha</h2>
        <p>Enviaremos as instruções de recuperação para o seu e-mail</p>
      </div>
    </div>

    <!-- FORMULÁRIO DE RECUPERAÇÃO -->
    <form class="form-group" onsubmit="event.preventDefault(); alert('Instruções enviadas para o e-mail cadastrado!'); window.location.href='index.html';">
      
      <div class="input-wrapper">
        <div class="input-icon">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/></svg>
        </div>
        <input type="email" class="input-field" placeholder="Digite seu e-mail cadastrado" required />
      </div>

      <button type="submit" class="btn-primary">
        Enviar Instruções
      </button>

    </form>

    <div class="footer-text">
      Lembrou da senha? <a href="index.html">Voltar ao Login</a>
    </div>

  </div>

</body>
</html>
