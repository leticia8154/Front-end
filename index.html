<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>EstaciA - Entrar</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Inter', sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background: linear-gradient(180deg, #0d47a1 0%, #1565c0 50%, #0a2540 100%);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 16px;
    }

    .card-container {
      background-color: #f7f4ee;
      width: 100%;
      max-width: 420px;
      border-radius: 28px;
      overflow: hidden;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
      padding: 32px 24px;
      display: flex;
      flex-direction: column;
      gap: 20px;
      transition: max-width 0.3s ease;
    }

    /* ADAPTAÇÃO PARA TABLETS E CENTRAIS VEICULARES */
    @media (min-width: 768px) {
      .card-container {
        max-width: 680px;
        padding: 40px 36px;
        gap: 24px;
      }

      .logo-title {
        font-size: 32px !important;
      }

      .logo-subtitle {
        font-size: 15px !important;
      }

      .input-field {
        font-size: 16px !important;
        padding: 16px 14px !important;
      }

      .btn-primary {
        padding: 18px !important;
        font-size: 17px !important;
      }
    }

    /* Header e Logo */
    .brand-header {
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
    }

    .logo-badge {
      width: 60px;
      height: 60px;
      background-color: #1565c0;
      border-radius: 18px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #ffffff;
      box-shadow: 0 4px 12px rgba(21, 101, 192, 0.3);
    }

    .logo-title {
      font-size: 26px;
      font-weight: 800;
      color: #1a1a1a;
      letter-spacing: -0.5px;
    }

    .logo-subtitle {
      font-size: 13px;
      color: #666666;
    }

    /* Formulário */
    .form-group {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .input-wrapper {
      position: relative;
      background-color: #ffffff;
      border: 1px solid #e2e8f0;
      border-radius: 14px;
      display: flex;
      align-items: center;
      padding: 0 14px;
      transition: all 0.2s ease;
    }

    .input-wrapper:focus-within {
      border-color: #1565c0;
      box-shadow: 0 0 0 3px rgba(21, 101, 192, 0.12);
    }

    .input-icon {
      color: #1565c0;
      display: flex;
      align-items: center;
      margin-right: 10px;
      flex-shrink: 0;
    }

    .input-field {
      width: 100%;
      border: none;
      background: transparent;
      padding: 14px 0;
      font-size: 14px;
      font-weight: 500;
      color: #2d3748;
      outline: none;
    }

    .form-options {
      display: flex;
      justify-content: flex-end;
      align-items: center;
    }

    .forgot-link {
      font-size: 12px;
      font-weight: 600;
      color: #1565c0;
      text-decoration: none;
    }

    .btn-primary {
      width: 100%;
      background-color: #1565c0;
      color: #ffffff;
      border: none;
      padding: 16px;
      border-radius: 14px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      box-shadow: 0 4px 12px rgba(21, 101, 192, 0.3);
      text-decoration: none;
      margin-top: 6px;
    }

    .footer-text {
      text-align: center;
      font-size: 13px;
      color: #666666;
    }

    .footer-text a {
      color: #1565c0;
      font-weight: 700;
      text-decoration: none;
    }
  </style>
</head>
<body>

  <div class="card-container">
    
    <!-- MARCA E LOGO -->
    <div class="brand-header">
      <div class="logo-badge">
        <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><rect x="3" y="3" width="18" height="18" rx="4"/><path d="M9 17V7h4a3 3 0 0 1 0 6H9"/></svg>
      </div>
      <h1 class="logo-title">EstaciA</h1>
      <p class="logo-subtitle">Encontre sua vaga de forma rápida e prática</p>
    </div>

    <!-- FORMULÁRIO DE LOGIN -->
    <form class="form-group" onsubmit="event.preventDefault(); window.location.href='principal.html';">
      
      <div class="input-wrapper">
        <div class="input-icon">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/></svg>
        </div>
        <input type="email" class="input-field" placeholder="E-mail" required />
      </div>

      <div class="input-wrapper">
        <div class="input-icon">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
        </div>
        <input type="password" class="input-field" placeholder="Senha" required />
      </div>

      <div class="form-options">
        <a href="recuperar.html" class="forgot-link">Esqueceu a senha?</a>
      </div>

      <button type="submit" class="btn-primary">
        Entrar
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg>
      </button>

    </form>

    <!-- CRIAÇÃO DE CONTA -->
    <div class="footer-text">
      Não tem uma conta? <a href="cadastro.html">Cadastre-se</a>
    </div>

  </div>

</body>
</html>
