<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>EstaciA - Entrar</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Inter', sans-serif;
    }

    body {
      background: linear-gradient(180deg, #0d47a1 0%, #1565c0 50%, #0a2540 100%);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    .card-container {
      background-color: #ffffff;
      width: 100%;
      max-width: 380px;
      height: 640px;
      border-radius: 28px;
      overflow: hidden;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
      display: flex;
      flex-direction: column;
    }

    .hero-section {
      background-color: #f5f0e6;
      padding: 24px 20px 16px 20px;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 210px;
    }

    .hero-logo {
      height: 60px !important;
      width: auto !important;
      max-width: 200px !important;
      object-fit: contain !important;
      mix-blend-mode: multiply !important;
      display: block;
      margin: 0 auto 8px auto;
    }

    .hero-title {
      font-size: 22px;
      font-weight: 700;
      color: #1a1a1a;
      margin-bottom: 6px;
    }

    .hero-subtitle {
      font-size: 13px;
      color: #555555;
      line-height: 1.3;
    }

    .nav-tabs {
      display: flex;
      background-color: #f5f0e6;
      border-bottom: 1px solid #e0e0e0;
    }

    .tab-item {
      flex: 1;
      padding: 14px 0;
      text-align: center;
      text-decoration: none;
      font-size: 14px;
      font-weight: 600;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: all 0.2s;
    }

    .tab-item.active {
      background-color: #eef4ff;
      color: #1565c0;
      border-bottom: 2px solid #1565c0;
    }

    .tab-item.inactive {
      background-color: #ffffff;
      color: #666666;
    }

    .form-section {
      padding: 24px;
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .form-group-list {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .input-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .input-label {
      font-size: 13px;
      font-weight: 600;
      color: #333333;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .input-field {
      width: 100%;
      padding: 12px 14px;
      border: 1px solid #dcdcdc;
      border-radius: 12px;
      font-size: 14px;
      outline: none;
      transition: border-color 0.2s;
    }

    .input-field:focus {
      border-color: #1565c0;
    }

    .forgot-password {
      text-align: right;
      font-size: 12px;
      color: #1565c0;
      text-decoration: none;
      font-weight: 600;
      margin-top: -4px;
    }

    .btn-submit {
      width: 100%;
      background-color: #1565c0;
      color: #ffffff;
      border: none;
      padding: 14px;
      border-radius: 12px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      box-shadow: 0 4px 10px rgba(21, 101, 192, 0.3);
    }

    .footer-text {
      text-align: center;
      font-size: 13px;
      color: #666666;
    }

    .footer-text a {
      color: #1565c0;
      text-decoration: none;
      font-weight: 600;
    }
  </style>
</head>
<body>

  <div class="card-container">
    <div class="hero-section">
      <img src="logo.png" alt="EstaciA" class="hero-logo" onerror="this.onerror=null; this.src='data:image/svg+xml;utf8,<svg xmlns=\'http://www.w3.org/2000/svg\' viewBox=\'0 0 200 60\'><text x=\'50%\' y=\'40\' font-family=\'sans-serif\' font-size=\'28\' font-weight=\'bold\' fill=\'%231565c0\' text-anchor=\'middle\'>estaci<tspan fill=\'%231a1a1a\'>A</tspan></text></svg>';" />
      <h1 class="hero-title">Bem-vindo!</h1>
      <p class="hero-subtitle">Estacionamento inteligente ao<br>seu alcance</p>
    </div>

    <div class="nav-tabs">
      <a href="index.html" class="tab-item active">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/><polyline points="10 17 15 12 10 7"/><line x1="15" y1="12" x2="3" y2="12"/></svg>
        Entrar
      </a>
      <a href="cadastro.html" class="tab-item inactive">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M16 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="8.5" cy="7" r="4"/><line x1="20" y1="8" x2="20" y2="14"/><line x1="23" y1="11" x2="17" y2="11"/></svg>
        Cadastrar
      </a>
    </div>

    <form class="form-section" onsubmit="event.preventDefault(); window.location.href='principal.html';">
      <div class="form-group-list">
        <div class="input-group">
          <label class="input-label">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/></svg>
            E-mail
          </label>
          <input type="email" class="input-field" placeholder="seu@email.com" required />
        </div>

        <div class="input-group">
          <label class="input-label">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
            Senha
          </label>
          <input type="password" class="input-field" placeholder="••••••••" required />
        </div>

        <a href="recuperar.html" class="forgot-password">Esqueceu a senha?</a>
      </div>

      <div style="display: flex; flex-direction: column; gap: 14px;">
        <button type="submit" class="btn-submit">Entrar</button>
        <p class="footer-text">Não tem uma conta? <a href="cadastro.html">Cadastre-se</a></p>
      </div>
    </form>
  </div>

</body>
</html>
