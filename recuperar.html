<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>EstaciA - Recuperar Senha</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Inter', sans-serif;
    }

    body {
      background: linear-gradient(180deg, #0d47a1 0%, #1565c0 50%, #0a2540 100%);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    .card-container {
      background-color: #ffffff;
      width: 100%;
      max-width: 380px;
      height: 640px;
      border-radius: 28px;
      overflow: hidden;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
      display: flex;
      flex-direction: column;
    }

    .hero-section {
      background-color: #f5f0e6;
      padding: 24px 20px 16px 20px;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 210px;
    }

    .hero-logo {
      height: 60px !important;
      width: auto !important;
      max-width: 200px !important;
      object-fit: contain !important;
      mix-blend-mode: multiply !important;
      display: block;
      margin: 0 auto 8px auto;
    }

    .hero-title {
      font-size: 22px;
      font-weight: 700;
      color: #1a1a1a;
      margin-bottom: 6px;
    }

    .hero-subtitle {
      font-size: 13px;
      color: #555555;
      line-height: 1.3;
    }

    .form-section {
      padding: 32px 24px;
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .form-group-list {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .input-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .input-label {
      font-size: 13px;
      font-weight: 600;
      color: #333333;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .input-field {
      width: 100%;
      padding: 12px 14px;
      border: 1px solid #dcdcdc;
      border-radius: 12px;
      font-size: 14px;
      outline: none;
      transition: border-color 0.2s;
    }

    .input-field:focus {
      border-color: #1565c0;
    }

    .btn-submit {
      width: 100%;
      background-color: #1565c0;
      color: #ffffff;
      border: none;
      padding: 14px;
      border-radius: 12px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      box-shadow: 0 4px 10px rgba(21, 101, 192, 0.3);
    }

    .footer-text {
      text-align: center;
      font-size: 13px;
      color: #666666;
    }

    .footer-text a {
      color: #1565c0;
      text-decoration: none;
      font-weight: 600;
    }
  </style>
</head>
<body>

  <div class="card-container">
    <div class="hero-section">
      <img src="logo.png" alt="EstaciA" class="hero-logo" onerror="this.onerror=null; this.src='data:image/svg+xml;utf8,<svg xmlns=\'http://www.w3.org/2000/svg\' viewBox=\'0 0 200 60\'><text x=\'50%\' y=\'40\' font-family=\'sans-serif\' font-size=\'28\' font-weight=\'bold\' fill=\'%231565c0\' text-anchor=\'middle\'>estaci<tspan fill=\'%231a1a1a\'>A</tspan></text></svg>';" />
      <h1 class="hero-title">Recuperar Senha</h1>
      <p class="hero-subtitle">Informe seu e-mail cadastrado para<br>receber as instruções</p>
    </div>

    <form class="form-section" onsubmit="event.preventDefault(); alert('Instruções enviadas para o seu e-mail!'); window.location.href='index.html';">
      <div class="form-group-list">
        <div class="input-group">
          <label class="input-label">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/></svg>
            E-mail cadastrado
          </label>
          <input type="email" class="input-field" placeholder="seu@email.com" required />
        </div>
      </div>

      <div style="display: flex; flex-direction: column; gap: 14px;">
        <button type="submit" class="btn-submit">Enviar link de recuperação</button>
        <p class="footer-text"><a href="index.html">← Voltar para o Login</a></p>
      </div>
    </form>
  </div>

</body>
</html>
