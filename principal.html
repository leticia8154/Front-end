<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>EstaciA - Início</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Inter', sans-serif;
    }

    body {
      background: linear-gradient(180deg, #0d47a1 0%, #1565c0 50%, #0a2540 100%);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    .card-container {
      background-color: #f7f4ee;
      width: 100%;
      max-width: 380px;
      border-radius: 28px;
      overflow: hidden;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
      padding: 24px 20px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .header-user {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
    }

    .user-info h2 {
      font-size: 22px;
      font-weight: 700;
      color: #1a1a1a;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .user-info p {
      font-size: 12px;
      color: #666666;
      margin-top: 2px;
    }

    .logout-btn {
      background: none;
      border: none;
      color: #1565c0;
      cursor: pointer;
      padding: 4px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .select-section {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .select-label {
      font-size: 11px;
      font-weight: 700;
      color: #888888;
      letter-spacing: 0.5px;
    }

    .select-box {
      width: 100%;
      background-color: #ffffff;
      border: 1px solid #e0e0e0;
      border-radius: 14px;
      padding: 12px 14px;
      font-size: 14px;
      font-weight: 600;
      color: #1a1a1a;
      display: flex;
      align-items: center;
      justify-content: space-between;
      box-shadow: 0 2px 5px rgba(0,0,0,0.03);
    }

    .stats-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
    }

    .stat-card {
      background-color: #ffffff;
      border-radius: 16px;
      padding: 14px 8px;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      box-shadow: 0 2px 6px rgba(0,0,0,0.03);
    }

    .icon-badge {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      background-color: #eef4ff;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 8px;
      color: #1565c0;
    }

    .stat-value {
      font-size: 15px;
      font-weight: 700;
      color: #1a1a1a;
    }

    .stat-label {
      font-size: 11px;
      color: #777777;
      margin-top: 2px;
    }

    .btn-search {
      width: 100%;
      background-color: #1565c0;
      color: #ffffff;
      border: none;
      padding: 14px;
      border-radius: 14px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      box-shadow: 0 4px 12px rgba(21, 101, 192, 0.3);
    }

    .recent-section {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .recent-title {
      font-size: 13px;
      font-weight: 700;
      color: #1a1a1a;
    }

    .history-card {
      background-color: #ffffff;
      border-radius: 14px;
      padding: 12px 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      box-shadow: 0 2px 5px rgba(0,0,0,0.03);
    }

    .history-info {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .history-details strong {
      display: block;
      font-size: 13px;
      color: #1a1a1a;
    }

    .history-details span {
      font-size: 11px;
      color: #888888;
    }

    .history-price {
      font-size: 13px;
      font-weight: 700;
      color: #1565c0;
    }
  </style>
</head>
<body>

  <div class="card-container">
    <div class="header-user">
      <div class="user-info">
        <h2>Olá, Letícia! 👋</h2>
        <p>silvaleticia0008@gmail.com</p>
      </div>
      <a href="index.html" class="logout-btn" title="Sair">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
      </a>
    </div>

    <div class="select-section">
      <span class="select-label">SHOPPING ATUAL</span>
      <div class="select-box">
        <div style="display: flex; align-items: center; gap: 8px;">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#1565c0" stroke-width="2"><rect x="4" y="2" width="16" height="20" rx="2"/><line x1="9" y1="6" x2="9" y2="6"/><line x1="15" y1="6" x2="15" y2="6"/><line x1="9" y1="10" x2="9" y2="10"/><line x1="15" y1="10" x2="15" y2="10"/><line x1="9" y1="14" x2="9" y2="14"/><line x1="15" y1="14" x2="15" y2="14"/><line x1="9" y1="18" x2="15" y2="18"/></svg>
          Shopping Center - Bloco A
        </div>
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#666" stroke-width="2"><polyline points="6 9 12 15 18 9"/></svg>
      </div>
    </div>

    <div class="stats-grid">
      <div class="stat-card">
        <div class="icon-badge">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="4"/><path d="M9 17V7h4a3 3 0 0 1 0 6H9"/></svg>
        </div>
        <span class="stat-value">11</span>
        <span class="stat-label">Usos</span>
      </div>

      <div class="stat-card">
        <div class="icon-badge">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
        </div>
        <span class="stat-value">22h</span>
        <span class="stat-label">Total</span>
      </div>

      <div class="stat-card">
        <div class="icon-badge">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="5" width="20" height="14" rx="3"/><line x1="2" y1="10" x2="22" y2="10"/></svg>
        </div>
        <span class="stat-value">R$ 220,00</span>
        <span class="stat-label">Gasto</span>
      </div>
    </div>

    <button class="btn-search">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
      Buscar Vaga Disponível
    </button>

    <div class="recent-section">
      <span class="recent-title">Estacionamentos Recentes</span>
      
      <div class="history-card">
        <div class="history-info">
          <div class="icon-badge" style="margin-bottom:0; width:34px; height:34px;">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg>
          </div>
          <div class="history-details">
            <strong>Setor A2 - Vaga 145</strong>
            <span>05/04/2026 • 3h 20min</span>
          </div>
        </div>
        <span class="history-price">R$ 18,00</span>
      </div>

      <div class="history-card">
        <div class="history-info">
          <div class="icon-badge" style="margin-bottom:0; width:34px; height:34px;">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg>
          </div>
          <div class="history-details">
            <strong>Setor B1 - Vaga 089</strong>
            <span>02/04/2026 • 1h 45min</span>
          </div>
        </div>
        <span class="history-price">R$ 12,00</span>
      </div>
    </div>
  </div>

</body>
</html>
